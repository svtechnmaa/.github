name: Trivy Filesystem Scan
description: Scan files changed in a pull request and collect results for trivy-report.

inputs:
  trivy_server:
    description: Trivy server URL. The action falls back to local scanning if unavailable.
    required: false
    default: ""
  severity:
    description: Comma-separated severity levels to scan.
    required: false
    default: CRITICAL,HIGH
  scanners:
    description: Comma-separated Trivy scanners to enable.
    required: false
    default: secret,misconfig,vuln
  finding_policy:
    description: Organization TRIVY_FINDING_POLICY JSON with expiring vulnerability and misconfiguration exceptions.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve repository finding policy
      id: finding_policy
      shell: bash
      env:
        TRIVY_FINDING_POLICY_JSON: ${{ inputs.finding_policy }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/resolve-trivy-finding-policy.sh"

    - name: Update Helm dependencies
      shell: bash
      run: |
        find . -name "Chart.yaml" -not -path "*/.git/*" -print0 | while IFS= read -r -d '' file; do
          helm dependency update "$(dirname "$file")" 2>/dev/null || true
        done
      continue-on-error: true

    - name: Prepare changed files
      id: prepare_scope
      shell: bash
      run: |
        set -euo pipefail
        base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
        head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
        scope_dir=".trivy-scope"
        changed_files="changed-files.txt"

        rm -rf "$scope_dir"
        rm -f trivy-fs.json
        mkdir -p "$scope_dir"
        echo "Scanning changed files in range: ${base_sha}...${head_sha}"
        if ! git diff --name-only --diff-filter=ACMR "${base_sha}...${head_sha}" > "$changed_files"; then
          echo "::error::Unable to diff ${base_sha}...${head_sha}. Configure actions/checkout with fetch-depth: 0."
          exit 1
        fi

        copied_count=0
        while IFS= read -r file; do
          [ -n "$file" ] || continue
          [ -f "$file" ] || continue
          mkdir -p "$scope_dir/$(dirname "$file")"
          cp -- "$file" "$scope_dir/$file"
          copied_count=$((copied_count + 1))
        done < "$changed_files"

        if [ "$copied_count" -eq 0 ]; then
          echo '{"SchemaVersion":2,"Results":[]}' > trivy-fs.json
          echo "has_scope=false" >> "$GITHUB_OUTPUT"
          echo "No changed files are available to scan."
        else
          echo "has_scope=true" >> "$GITHUB_OUTPUT"
          find "$scope_dir" -type f -print
        fi

    - name: Check Trivy server
      id: trivy_mode
      if: steps.prepare_scope.outputs.has_scope == 'true'
      shell: bash
      env:
        TRIVY_SERVER: ${{ inputs.trivy_server }}
      run: |
        if [ -n "$TRIVY_SERVER" ] && curl -sS --fail --max-time 5 "${TRIVY_SERVER%/}/healthz" >/dev/null; then
          echo "use_server=true" >> "$GITHUB_OUTPUT"
        else
          [ -z "$TRIVY_SERVER" ] || echo "Trivy server is unavailable; using local scans."
          echo "use_server=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Scan changed files
      id: scan_files
      if: steps.prepare_scope.outputs.has_scope == 'true'
      shell: bash
      env:
        TRIVY_SERVER: ${{ inputs.trivy_server }}
        TRIVY_SCANNERS: ${{ inputs.scanners }}
        TRIVY_SEVERITY: ${{ inputs.severity }}
        USE_SERVER: ${{ steps.trivy_mode.outputs.use_server }}
      run: |
        scan_fs() {
          trivy fs "$@" \
            --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" \
            --ignore-unfixed \
            --file-patterns "dockerfile:.*[Dd]ockerfile.*" \
            --format json --output trivy-fs.json --exit-code 0 .trivy-scope
        }
        if [ "$USE_SERVER" = "true" ]; then
          if ! scan_fs --server "$TRIVY_SERVER"; then
            echo "Trivy server scan failed; retrying locally."
            rm -f trivy-fs.json
            scan_fs
          fi
        else
          scan_fs
        fi
      continue-on-error: true

    - name: Collect filesystem scan result
      if: always()
      shell: bash
      env:
        HAS_SCOPE: ${{ steps.prepare_scope.outputs.has_scope }}
        PREPARE_OUTCOME: ${{ steps.prepare_scope.outcome }}
        SCAN_OUTCOME: ${{ steps.scan_files.outcome }}
        ALLOW_VULNERABILITIES: ${{ steps.finding_policy.outputs.allow_vulnerabilities }}
        ALLOW_MISCONFIGURATIONS: ${{ steps.finding_policy.outputs.allow_misconfigurations }}
        EXCEPTION_DETAILS: ${{ steps.finding_policy.outputs.exception_details }}
        SCAN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        SCAN_AUTHOR: ${{ github.actor }}
      run: |
        report_dir="${RUNNER_TEMP}/trivy-collect/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$report_dir"
        scan_result_dir="$(mktemp -d "$report_dir/scan.XXXXXXXX")"
        if [ ! -s trivy-fs.json ]; then echo '{"SchemaVersion":2,"Results":[]}' > trivy-fs.json; fi
        cp trivy-fs.json "$scan_result_dir/report.json"
        scan_ok=false
        if [ "$PREPARE_OUTCOME" != "success" ]; then
          scan_ok=false
        elif [ "$HAS_SCOPE" != "true" ]; then
          scan_ok=true
        elif [ "$SCAN_OUTCOME" = "success" ] && jq -e 'type == "object" and has("SchemaVersion") and ((has("Results") | not) or (.Results == null) or (.Results | type == "array"))' trivy-fs.json >/dev/null 2>&1; then
          scan_ok=true
        fi
        exception_details="$EXCEPTION_DETAILS"
        if [ -z "$exception_details" ]; then exception_details='{}'; fi
        jq -n --arg kind filesystem --arg target "changed files in pull request" --arg commit "$SCAN_COMMIT" --arg author "$SCAN_AUTHOR" --arg allow "$ALLOW_VULNERABILITIES" --arg allow_misconfigurations "$ALLOW_MISCONFIGURATIONS" --argjson exceptions "$exception_details" --arg ok "$scan_ok" \
          '{kind:$kind,target:$target,commit_id:$commit,commit_author:$author,allow_vulnerabilities:($allow == "true"),allow_misconfigurations:($allow_misconfigurations == "true"),exception_details:$exceptions,scan_succeeded:($ok == "true")}' > "$scan_result_dir/meta.json"
