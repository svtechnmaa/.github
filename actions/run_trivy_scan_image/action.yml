name: Docker Image Scan and Mail
description: Scan a Docker image with Trivy, write an actionable summary, and email HIGH/CRITICAL findings

inputs:
  image_name:
    description: "Docker image name to scan"
    required: true
  image_tag:
    description: "Docker image tag to scan"
    required: false
    default: "latest"
  trivy_server:
    description: "Trivy server URL (if using server mode)"
    required: false
    default: ""
  mail_username:
    description: "SMTP username for sending email"
    required: true
  mail_password:
    description: "SMTP password for sending email"
    required: true
  commit_author_name:
    description: "Name of commit author to include in email"
    required: true
  mail_receivers:
    description: "Mail addresses of recipients"
    required: true
  commit_id:
    description: "Commit ID associated with this scan"
    required: true
  job_id:
    description: "GitHub job ID for the current workflow run"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Scan Docker image
      id: scan_docker_image
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        TRIVY_SERVER: ${{ inputs.trivy_server }}
      run: |
        echo "🔍 Checking Trivy server availability..."

        if [ -n "$TRIVY_SERVER" ] && curl -sS --fail "${TRIVY_SERVER%/}/healthz" > /dev/null; then
          echo "✅ Trivy server is UP"
          trivy image \
            --server "$TRIVY_SERVER" \
            --timeout 5m \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-image-report.json \
            --exit-code 0 \
            "$IMAGE_REF"
        else
          echo "⚠️ Trivy server is unavailable. Falling back to local scan."
          trivy image \
            --timeout 5m \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-image-report.json \
            --exit-code 0 \
            "$IMAGE_REF"
        fi
      continue-on-error: true

    - name: Parse image findings
      id: logging_vulns
      if: always()
      shell: bash
      run: |
        IMAGE_VULN=0
        SCAN_OK=false

        if [ -s trivy-image-report.json ] && jq empty trivy-image-report.json 2>/dev/null; then
          IMAGE_VULN=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image-report.json 2>/dev/null || echo 0)
          SCAN_OK=true
        else
          echo "::warning::Trivy did not produce a valid image JSON report. Check the scan logs."
        fi

        if [ "$SCAN_OK" != "true" ]; then
          STATUS="⚠️ Scan failed"
          DETECTED=false
        elif [ "$IMAGE_VULN" -gt 0 ]; then
          STATUS="❌ Issues found"
          DETECTED=true
          echo "🚨 Detected $IMAGE_VULN HIGH/CRITICAL image vulnerability finding(s)."
        else
          STATUS="✅ Clean"
          DETECTED=false
          echo "✅ No HIGH/CRITICAL image vulnerabilities detected."
        fi

        echo "IMAGE_VULN=$IMAGE_VULN" >> "$GITHUB_ENV"
        echo "SCAN_OK=$SCAN_OK" >> "$GITHUB_ENV"
        echo "SCAN_STATUS=$STATUS" >> "$GITHUB_ENV"
        echo "detected_vulns=$DETECTED" >> "$GITHUB_OUTPUT"
        echo "finding_count=$IMAGE_VULN" >> "$GITHUB_OUTPUT"
        echo "scan_ok=$SCAN_OK" >> "$GITHUB_OUTPUT"

    - name: Convert image report to SARIF
      id: convert_sarif
      if: always() && steps.logging_vulns.outputs.scan_ok == 'true'
      shell: bash
      run: |
        if trivy convert --format sarif trivy-image-report.json > trivy-image-report.sarif; then
          echo "has_sarif=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Unable to convert the Trivy image report to SARIF."
          echo "has_sarif=false" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Write summary
      if: always()
      shell: bash
      env:
        REPORT_IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        REPORT_AUTHOR: ${{ inputs.commit_author_name }}
        REPORT_COMMIT: ${{ inputs.commit_id }}
      run: |
        IMAGE_VULN="${IMAGE_VULN:-0}"
        SCAN_OK="${SCAN_OK:-false}"
        SCAN_STATUS="${SCAN_STATUS:-⚠️ Scan failed}"
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${REPORT_COMMIT}"

        {
          echo "# 🐳 Trivy Image Scan — $SCAN_STATUS"
          echo ""
          echo "**Image:** \`$REPORT_IMAGE_REF\` · **Commit:** [\`$REPORT_COMMIT\`]($COMMIT_URL) · **Author:** \`$REPORT_AUTHOR\`"
          echo ""
          echo "| Category | Count | Status |"
          echo "|----------|:-----:|:------:|"
          echo "| Image vulnerabilities (HIGH,CRITICAL) | $IMAGE_VULN | $([ "$SCAN_OK" != "true" ] && echo "⚠️" || { [ "$IMAGE_VULN" -eq 0 ] && echo "✅" || echo "❌"; }) |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$SCAN_OK" != "true" ]; then
          {
            echo "## Next actions"
            echo ""
            echo "1. Open the scan logs and resolve the Trivy server, registry authentication, image availability, or local database error."
            echo "2. Rerun the workflow and confirm that a valid report is generated before relying on this result."
            echo ""
            echo "[View workflow run]($RUN_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        elif [ "$IMAGE_VULN" -gt 0 ] && [ -f trivy-image-report.json ]; then
          {
            echo "## Next actions"
            echo ""
            echo "1. Update each affected package to the version in **Fixed in** when available."
            echo "2. If the package comes from the base image, update the \`FROM\` image and rebuild."
            echo "3. Publish the remediated image, update the image reference, and rerun this workflow before deploying."
            echo ""
            if [ "${{ github.event.repository.private }}" = "false" ]; then
              echo "[View workflow run]($RUN_URL) · [View code scanning alerts](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)"
            else
              echo "[View workflow run]($RUN_URL)"
            fi
            echo ""
            echo "## Findings"
            echo ""
            echo "<details><summary>🔴 View all $IMAGE_VULN finding(s)</summary>"
            echo ""
            echo "| Target | Severity | CVE | Package | Installed | Fixed in |"
            echo "|--------|----------|-----|---------|-----------|----------|"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            def clean: tostring | gsub("[\r\n|]"; " ");
            .Results[]? |
            .Target as $target |
            .Vulnerabilities[]? |
            (
              if (.PrimaryURL // "") == ""
              then (.VulnerabilityID // "Unknown")
              else "[\(.VulnerabilityID // "Unknown")](\(.PrimaryURL))"
              end
            ) as $cve |
            "| \($target // "-" | clean) | \(.Severity // "-" | clean) | \($cve) | \(.PkgName // "-" | clean) | \(.InstalledVersion // "-" | clean) | \(if (.FixedVersion // "") == "" then "-" else (.FixedVersion | clean) end) |"
          ' trivy-image-report.json >> "$GITHUB_STEP_SUMMARY" || true

          {
            echo ""
            echo "</details>"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "No action required. The image has no HIGH/CRITICAL findings."
            echo ""
            echo "[View workflow run]($RUN_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Determine scan report URL
      if: steps.logging_vulns.outputs.detected_vulns == 'true'
      shell: bash
      env:
        REPORT_JOB_ID: ${{ inputs.job_id }}
      run: |
        if [ "${{ github.event.repository.private }}" = "true" ]; then
          echo "scan_report_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${REPORT_JOB_ID}" >> "$GITHUB_ENV"
        else
          echo "scan_report_url=${{ github.server_url }}/${{ github.repository }}/security/code-scanning" >> "$GITHUB_ENV"
        fi
      continue-on-error: true

    - name: Upload SARIF to Security tab
      if: steps.logging_vulns.outputs.detected_vulns == 'true' && steps.convert_sarif.outputs.has_sarif == 'true' && github.event.repository.private == 'false'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-image-report.sarif
        category: trivy-docker-image
      continue-on-error: true

    - name: Clean noreply mail receivers
      if: steps.logging_vulns.outputs.detected_vulns == 'true'
      shell: bash
      env:
        RAW_MAIL_RECEIVERS: ${{ inputs.mail_receivers }}
        FALLBACK_MAIL_RECEIVER: ${{ inputs.mail_username }}
      run: |
        CLEAN=$(echo "$RAW_MAIL_RECEIVERS" | tr ',' '\n' | grep -v 'noreply.github.com' | grep -v '^$' | tr '\n' ',' | sed 's/,$//')

        if [ -z "$CLEAN" ]; then
          CLEAN="$FALLBACK_MAIL_RECEIVER"
        fi

        echo "MAIL_RECEIVERS=$CLEAN" >> "$GITHUB_ENV"
      continue-on-error: true

    - name: Build image mail report
      if: steps.logging_vulns.outputs.detected_vulns == 'true'
      shell: bash
      env:
        REPORT_IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        REPORT_AUTHOR: ${{ inputs.commit_author_name }}
        REPORT_COMMIT: ${{ inputs.commit_id }}
      run: |
        {
          echo "Trivy Docker Image Scan — $SCAN_STATUS"
          echo "==============================================="
          echo "Repository : ${{ github.repository }}"
          echo "Image      : $REPORT_IMAGE_REF"
          echo "Author     : $REPORT_AUTHOR"
          echo "Commit     : ${{ github.server_url }}/${{ github.repository }}/commit/$REPORT_COMMIT"
          echo "Report     : $scan_report_url"
          echo ""
          echo "Findings summary"
          echo "----------------"
          echo "HIGH/CRITICAL image vulnerabilities: ${IMAGE_VULN:-0}"
          echo ""
          echo "Affected packages"
          echo "-----------------"
          jq -r '
            .Results[]? |
            .Target as $target |
            .Vulnerabilities[]? |
            "Target    : \($target // "-")\nCVE       : \(.VulnerabilityID // "Unknown")\nSeverity  : \(.Severity // "Unknown")\nPackage   : \(.PkgName // "Unknown")\nInstalled : \(.InstalledVersion // "Unknown")\nFixed in  : \(if (.FixedVersion // "") == "" then "Not provided by Trivy" else .FixedVersion end)\nReference : \(.PrimaryURL // "-")\n"
          ' trivy-image-report.json 2>/dev/null || echo "(unable to read findings)"
          echo "Next actions"
          echo "------------"
          echo "1. Update affected packages to the Fixed in version when available."
          echo "2. Update the base image when the affected package comes from FROM."
          echo "3. Rebuild and publish the image, then rerun the workflow before deploying."
        } > trivy-image-mail-report.txt
      continue-on-error: true

    - name: Send mail if vulnerabilities detected
      if: steps.logging_vulns.outputs.detected_vulns == 'true'
      uses: dawidd6/action-send-mail@v16
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ inputs.mail_username }}
        password: ${{ inputs.mail_password }}
        subject: "[Trivy] ${{ env.IMAGE_VULN }} HIGH/CRITICAL finding(s) in ${{ inputs.image_name }}:${{ inputs.image_tag }}"
        body: file://trivy-image-mail-report.txt
        to: ${{ env.MAIL_RECEIVERS }}
        from: Security Bot <${{ inputs.mail_username }}>
      continue-on-error: true
