name: Send Trivy Report Email
description: Send one Trivy report email after the scan job finishes and its GitHub Summary is available.

inputs:
  artifact_name:
    description: Artifact name produced by trivy-report when findings or scan errors require an email.
    required: true
  mail_username:
    description: SMTP sender address.
    required: true
  mail_password:
    description: SMTP password.
    required: true
  mail_receivers:
    description: Comma-separated report recipients.
    required: false
    default: ""
  it_team_email:
    description: Recipient added when the report contains secrets.
    required: false
    default: ""
  smtp_server:
    description: SMTP server.
    required: false
    default: smtp.gmail.com
  smtp_port:
    description: SMTP port.
    required: false
    default: "465"

runs:
  using: composite
  steps:
    - name: Download Trivy mail files
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: .

    - name: Read mail details
      id: mail_details
      shell: bash
      env:
        RAW_MAIL_RECEIVERS: ${{ inputs.mail_receivers }}
        IT_TEAM_EMAIL: ${{ inputs.it_team_email }}
        FALLBACK_MAIL_RECEIVER: ${{ inputs.mail_username }}
      run: |
        subject="$(jq -er '.subject | select(type == "string" and length > 0)' trivy-mail-details.json)"
        secret_count="$(jq -er '.secret_count | select(type == "number" and . >= 0)' trivy-mail-details.json)"
        recipients="$RAW_MAIL_RECEIVERS"
        if [ "$secret_count" -gt 0 ]; then recipients="${recipients},${IT_TEAM_EMAIL}"; fi
        recipients="$(printf '%s' "$recipients" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d; /noreply\.github\.com/d' | sort -u | paste -sd, -)"
        if [ -z "$recipients" ]; then recipients="$FALLBACK_MAIL_RECEIVER"; fi
        if [ -z "$recipients" ]; then echo 'No Trivy mail recipients configured' >&2; exit 1; fi
        echo "subject=$subject" >> "$GITHUB_OUTPUT"
        echo "mail_receivers=$recipients" >> "$GITHUB_OUTPUT"

    - name: Send Trivy report mail
      uses: dawidd6/action-send-mail@v16
      with:
        server_address: ${{ inputs.smtp_server }}
        server_port: ${{ inputs.smtp_port }}
        secure: true
        username: ${{ inputs.mail_username }}
        password: ${{ inputs.mail_password }}
        subject: ${{ steps.mail_details.outputs.subject || '[TRIVY] Scan report' }}
        to: ${{ steps.mail_details.outputs.mail_receivers }}
        from: Security Bot <${{ inputs.mail_username }}>
        body: file://trivy-mail.txt
        html_body: file://trivy-mail.html
