name: Send Consolidated Trivy Mail
description: Send the collected Trivy mail after the scan job finishes and its GitHub Summary is available.

inputs:
  artifact_name:
    description: Artifact name produced by trivy-report in deferred mode.
    required: true
  mail_username:
    description: SMTP sender address.
    required: true
  mail_password:
    description: SMTP password.
    required: true
  smtp_server:
    description: SMTP server.
    required: false
    default: smtp.gmail.com
  smtp_port:
    description: SMTP port.
    required: false
    default: "465"

runs:
  using: composite
  steps:
    - name: Download consolidated mail
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: .

    - name: Read mail metadata
      id: metadata
      shell: bash
      run: |
        jq -e '.subject | type == "string" and length > 0' trivy-aggregate-mail.json > /dev/null
        jq -e '.mail_receivers | type == "string" and length > 0' trivy-aggregate-mail.json > /dev/null
        echo "subject=$(jq -r '.subject' trivy-aggregate-mail.json)" >> "$GITHUB_OUTPUT"
        echo "mail_receivers=$(jq -r '.mail_receivers' trivy-aggregate-mail.json)" >> "$GITHUB_OUTPUT"

    - name: Mail consolidated report
      uses: dawidd6/action-send-mail@v16
      with:
        server_address: ${{ inputs.smtp_server }}
        server_port: ${{ inputs.smtp_port }}
        secure: true
        username: ${{ inputs.mail_username }}
        password: ${{ inputs.mail_password }}
        subject: ${{ steps.metadata.outputs.subject || '[TRIVY] Consolidated scan report' }}
        to: ${{ steps.metadata.outputs.mail_receivers }}
        from: Security Bot <${{ inputs.mail_username }}>
        body: file://trivy-aggregate-mail.txt
        html_body: file://trivy-aggregate-mail.html
