name: Download artifact with SeaweedFS fallback
description: Download a named artifact through S3 if the GitHub download fails.
inputs:
  name:
    description: Name of the artifact to download
    default: artifact
  path:
    description: Directory where the artifact is restored; defaults to the workspace
    default: ${{ github.workspace }}
  s3-access-key:
    description: SeaweedFS access key; only used during fallback
    required: false
  s3-secret-key:
    description: SeaweedFS secret key; only used during fallback
    required: false
  s3-endpoint:
    description: S3 compatible endpoint
    default: https://s3.svtechdev.org
  s3-bucket:
    description: Artifact bucket
    default: github-artifacts
  s3-region:
    description: Signing region
    default: us-east-1
  s3-retry-count:
    description: Retries per S3 request after the initial attempt; 0 disables retries
    required: false
    default: '3'
outputs:
  download-path:
    description: Absolute path where the artifact was restored
    value: ${{ steps.download.outputs.download-path || steps.fallback.outputs.download-path }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      if: ${{ always() }}
      shell: bash
      env:
        ARTIFACT_ACTION_PATH: ${{ github.action_path }}
        NAME: ${{ inputs.name }}
        S3_RETRY_COUNT: ${{ inputs.s3-retry-count }}
      run: |
        set -euo pipefail
        source "$ARTIFACT_ACTION_PATH/../lib/validate.sh"
        validate_retry_count "$S3_RETRY_COUNT"
        export_artifact_name "$NAME"

    - name: Download from GitHub
      id: download
      if: ${{ always() && steps.validate.outcome == 'success' }}
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ steps.validate.outputs.name }}
        path: ${{ inputs.path }}

    - name: Download through SeaweedFS
      id: fallback
      if: ${{ always() && steps.download.outcome == 'failure' }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ steps.validate.outputs.name }}
        ARTIFACT_PATH: ${{ inputs.path }}
        ARTIFACT_S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        ARTIFACT_S3_BUCKET: ${{ inputs.s3-bucket }}
        ARTIFACT_S3_RETRY_COUNT: ${{ inputs.s3-retry-count }}
        AWS_DEFAULT_REGION: ${{ inputs.s3-region }}
        AWS_ACCESS_KEY_ID: ${{ inputs.s3-access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-key }}
        ARTIFACT_ACTION_PATH: ${{ github.action_path }}
      run: bash "$ARTIFACT_ACTION_PATH/../lib/download.sh"
