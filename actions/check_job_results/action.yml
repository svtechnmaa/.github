name: 'Check job results'
description: 'Check job results; accept only explicitly marked Trivy vulnerability bypass failures, and fail for other failures or cancellations'
inputs:
  jobs:
    description: 'JSON representation of the needs context'
    required: true
runs:
  using: 'composite'
  steps:
  - name: Check job results
    shell: bash
    run: |
      bash "$ACTION_PATH/check-results.sh"
    env:
      JOBS: ${{ inputs.jobs }}
      ACTION_PATH: ${{ github.action_path }}
