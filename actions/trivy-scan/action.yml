name: Trivy Security Scan
description: >
  Scans filesystem container image for secrets, vulnerabilities,
  and misconfigurations via Trivy server with local fallback. Fails on fixable
  findings at configured severity. Sends email alerts when issues are found.

inputs:
  # ── Trivy ────────────────────────────────────────────────────────────────
  trivy-server:
    description: Trivy server URL (e.g. http://trivy.internal:4954)
    required: false
    default: ""
  severity:
    description: Comma-separated severity levels to fail on
    required: false
    default: CRITICAL,HIGH
  scanners:
    description: Comma-separated scanners to enable
    required: false
    default: secret,misconfig,vuln

  # ── Image scan ─────────────────────────────────────────────────
  enable-image-scan:
    description: Enable container image scan (trivy image)
    required: false
    default: "false"
  image-ref:
    description: Space-separated image list to scan (e.g. "app:abc1234 app-backend:abc1234"). Required if enable-image-scan is true.
    required: false
    default: ""

  # ── Mail ─────────────────────────────────────────────────────────────────
  mail-username:
    description: SMTP sender address
    required: true
  mail-password:
    description: SMTP password / App Password
    required: true
  it-team-email:
    description: IT team email — receives secret alerts
    required: true
  extra-recipients:
    description: Additional recipients (comma-separated), e.g. SRE team via vars.DEFAULT_MAIL_RECIPIENTS
    required: false
    default: ""
  smtp-server:
    description: SMTP server address
    required: false
    default: smtp.gmail.com
  smtp-port:
    description: SMTP server port
    required: false
    default: "465"

  # ── Artifact ─────────────────────────────────────────────────────────────
  retention-days:
    description: Days to retain the scan artifact
    required: false
    default: "30"
runs:
  using: composite
  steps:
    # ── 1. Helm dependency update (skip if no Chart.yaml) ──────────────────
    - name: Helm dependency update
      shell: bash
      run: |
        find . -name "Chart.yaml" -not -path "*/.git/*" | while read f; do
          helm dependency update "$(dirname "$f")" 2>/dev/null || true
        done
      continue-on-error: true

    # ── 2. Trivy fs scan ────────────────────────────────────────────────────
    - name: Prepare changed files for Trivy scan
      id: prepare-trivy-scope
      shell: bash
      run: |
        set -euo pipefail

        base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
        head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
        scope_dir=".trivy-scope"
        changed_files="changed-files.txt"

        echo "Scanning changed files in range: ${base_sha}...${head_sha}"

        rm -rf "${scope_dir}"
        mkdir -p "${scope_dir}"

        if ! git diff \
          --name-only \
          --diff-filter=ACMR \
          "${base_sha}...${head_sha}" \
          > "${changed_files}"; then
          echo "::error::Unable to diff ${base_sha}...${head_sha}. Configure actions/checkout with fetch-depth: 0 before using this composite action."
          exit 1
        fi

        echo "Changed files:"
        cat "${changed_files}"

        copied_count=0

        while IFS= read -r file; do
          [ -n "${file}" ] || continue
          [ -f "${file}" ] || continue

          mkdir -p "${scope_dir}/$(dirname "${file}")"
          cp -- "${file}" "${scope_dir}/${file}"

          copied_count=$((copied_count + 1))
        done < "${changed_files}"

        if [ "${copied_count}" -eq 0 ]; then
          echo "No changed files available for Trivy scan."
          echo '{"SchemaVersion":2,"Results":[]}' > trivy-fs.json
          echo "has_scope=false" >> "${GITHUB_OUTPUT}"
          echo "HAS_TRIVY_FS_SCOPE=false" >> "${GITHUB_ENV}"
          exit 0
        fi

        echo "Files included in Trivy scan:"
        find "${scope_dir}" -type f -print
        echo "has_scope=true" >> "${GITHUB_OUTPUT}"
        echo "HAS_TRIVY_FS_SCOPE=true" >> "${GITHUB_ENV}"
      continue-on-error: false

    - name: Determine Trivy scan mode
      id: trivy-mode
      if: steps.prepare-trivy-scope.outputs.has_scope == 'true' || inputs.enable-image-scan == 'true'
      shell: bash
      env:
        TRIVY_SERVER: ${{ inputs.trivy-server }}
      run: |
        if [ -n "$TRIVY_SERVER" ] && curl -sS --fail --max-time 5 "${TRIVY_SERVER%/}/healthz" > /dev/null; then
          echo "✅ Trivy server is UP. Using client/server mode."
          echo "use_server=true" >> "$GITHUB_OUTPUT"
        else
          if [ -n "$TRIVY_SERVER" ]; then
            echo "⚠️ Trivy server is unavailable. Falling back to local scans."
          else  
            echo "ℹ️ Trivy server is not configured. Using local scans."
          fi
          echo "use_server=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Trivy fs scan
      if: steps.prepare-trivy-scope.outputs.has_scope == 'true'
      shell: bash
      env:
        TRIVY_SERVER: ${{ inputs.trivy-server }}
        TRIVY_SCANNERS: ${{ inputs.scanners }}
        TRIVY_SEVERITY: ${{ inputs.severity }}
      run: |
        scan_fs() {
          trivy fs \
            "$@" \
            --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" \
            --file-patterns "dockerfile:.*[Dd]ockerfile.*" \
            --format json \
            --output trivy-fs.json \
            --exit-code 0 \
            .trivy-scope
        }

        if [ "${{ steps.trivy-mode.outputs.use_server }}" = "true" ]; then
          if ! scan_fs --server "$TRIVY_SERVER"; then
            echo "⚠️ Trivy server scan failed. Retrying filesystem scan locally."
            scan_fs
          fi
        else
          scan_fs
        fi
      continue-on-error: true

    # ── 3. Trivy image scan ─────────────────────────────────────
    - name: Trivy image scan
      if: inputs.enable-image-scan == 'true'
      shell: bash
      env:
        TRIVY_SERVER: ${{ inputs.trivy-server }}
        TRIVY_SCANNERS: ${{ inputs.scanners }}
        TRIVY_SEVERITY: ${{ inputs.severity }}
        TRIVY_IMAGE_REFS: ${{ inputs.image-ref }}
      run: |
        scan_image() {
          local image_ref="$1"
          local output_file="$2"
          shift 2

          trivy image \
            "$@" \
            --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" \
            --format json \
            --output "$output_file" \
            --exit-code 0 \
            "$image_ref"
        }

        for image_ref in $TRIVY_IMAGE_REFS; do
          echo "[INFO] Scanning $image_ref"
          label=$(echo "$image_ref" | tr '/:' '--')
          output_file="trivy-image-${label}.json"

          if [ "${{ steps.trivy-mode.outputs.use_server }}" = "true" ]; then
            if ! scan_image "$image_ref" "$output_file" --server "$TRIVY_SERVER"; then
              echo "⚠️ Trivy server scan failed for $image_ref. Retrying locally."
              scan_image "$image_ref" "$output_file"
            fi
          else
            scan_image "$image_ref" "$output_file"
          fi
        done
      continue-on-error: true
    # ── 4. Parse findings ───────────────────────────────────────────────────
    - name: Parse findings
      shell: bash
      run: |
        SECRET=0; VULN=0; MISCONF=0; IMAGE_VULN=0

        if [ -f trivy-fs.json ]; then
          SECRET=$(jq  '[.Results[]?.Secrets[]?] | length' trivy-fs.json 2>/dev/null || echo 0)
          VULN=$(jq    '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' trivy-fs.json 2>/dev/null || echo 0)
          MISCONF=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' trivy-fs.json 2>/dev/null || echo 0)
        fi

        for f in trivy-image-*.json; do
          [ -f "$f" ] || continue
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' "$f" 2>/dev/null || echo 0)
          IMAGE_VULN=$((IMAGE_VULN + COUNT))
        done

        echo "SECRET=$SECRET"         >> "$GITHUB_ENV"
        echo "VULN=$VULN"             >> "$GITHUB_ENV"
        echo "MISCONF=$MISCONF"       >> "$GITHUB_ENV"
        echo "IMAGE_VULN=$IMAGE_VULN" >> "$GITHUB_ENV"

        TOTAL=$((SECRET + VULN + MISCONF + IMAGE_VULN))
        [ "$TOTAL" -gt 0 ] && STATUS="❌ Issues found" || STATUS="✅ Clean"
        echo "SCAN_STATUS=$STATUS" >> "$GITHUB_ENV"

    # ── 5. Write $GITHUB_STEP_SUMMARY ──────────────────────────────────────
    - name: Write summary
      if: always()
      shell: bash
      run: |
        SECRET="${SECRET:-0}"
        VULN="${VULN:-0}"
        MISCONF="${MISCONF:-0}"
        IMAGE_VULN="${IMAGE_VULN:-0}"
        TOTAL=$((SECRET + VULN + MISCONF + IMAGE_VULN))

        {
          echo "# 🔍 Trivy — $SCAN_STATUS"
          echo ""
          echo "## 1. Summary"
          echo ""
          echo "**PR:** #${{ github.event.pull_request.number }} · **Commit:** \`${{ github.sha }}\` · **Author:** \`${{ github.actor }}\`"
          echo ""
          echo "| Category | Count | Status |"
          echo "|----------|:-----:|:------:|"
          echo "| 🔑 Secrets (${{ inputs.severity }}) | $SECRET | $([ "$SECRET"  = "0" ] && echo "✅" || echo "❌") |"
          echo "| 🛡️ Vulnerabilities (${{ inputs.severity }}) | $VULN | $([ "$VULN" = "0" ] && echo "✅" || echo "❌") |"
          echo "| ⚙️ Misconfigurations (${{ inputs.severity }}) | $MISCONF | $([ "$MISCONF" = "0" ] && echo "✅" || echo "❌") |"
          if [ "${{ inputs.enable-image-scan }}" = "true" ]; then
            echo "| 🐳 Image Vulnerabilities (${{ inputs.severity }}) | $IMAGE_VULN | $([ "$IMAGE_VULN" = "0" ] && echo "✅" || echo "❌") |"
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$VULN" -gt 0 ] && [ -f trivy-fs.json ]; then
          {
            echo "### 🛡️ Vulnerabilities"
            echo "<details><summary>🔴 View all $VULN finding(s)</summary>"
            echo ""
            echo "| Severity | CVE | Package | Installed | Fixed in | Target |"
            echo "|----------|-----|---------|-----------|----------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            def clean: tostring | gsub("[\r\n|]"; " ");
            .Results[]? |
            .Target as $target |
            .Vulnerabilities[]? |
            select(.Severity == "CRITICAL" or .Severity == "HIGH") |
            (
              if (.PrimaryURL // "") == ""
              then (.VulnerabilityID // "Unknown")
              else "[\(.VulnerabilityID // "Unknown")](\(.PrimaryURL))"
              end
            ) as $cve |
            "| \(.Severity) | \($cve) | \(.PkgName // "-" | clean) | \(.InstalledVersion // "-" | clean) | \(if (.FixedVersion // "") == "" then "-" else (.FixedVersion | clean) end) | \($target | sub("^\\.trivy-scope/"; "") | clean) |"
          ' trivy-fs.json >> "$GITHUB_STEP_SUMMARY" || true
          { echo ""; echo "</details>"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$MISCONF" -gt 0 ] && [ -f trivy-fs.json ]; then
          {
            echo "### ⚙️ Misconfigurations"
            echo "<details><summary>🟠 View all $MISCONF finding(s)</summary>"
            echo ""
            echo "| Severity | ID | Title | File | Line | Resolution |"
            echo "|----------|----|-------|------|:----:|------------|"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            def clean: tostring | gsub("[\r\n|]"; " ");
            .Results[]? |
            .Target as $t |
            .Misconfigurations[]? |
            select(.Severity == "CRITICAL" or .Severity == "HIGH") |
            (
              if (.PrimaryURL // "") == ""
              then (.ID // "Unknown")
              else "[\(.ID // "Unknown")](\(.PrimaryURL))"
              end
            ) as $id |
            "| \(.Severity) | \($id) | \(.Title // "-" | clean) | \($t | sub("^\\.trivy-scope/"; "") | clean) | \(.CauseMetadata.StartLine // "-") | \(.Resolution // "-" | clean) |"
          ' trivy-fs.json >> "$GITHUB_STEP_SUMMARY" || true
          { echo ""; echo "</details>"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$SECRET" -gt 0 ] && [ -f trivy-fs.json ]; then
          {
            echo "### 🔑 Secrets"
            echo "<details><summary>🔑 View all $SECRET secret(s)</summary>"
            echo ""
            echo "| Rule ID | Severity | Title | File | Line |"
            echo "|---------|----------|-------|------|:----:|"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            def clean: tostring | gsub("[\r\n|]"; " ");
            .Results[]? |
            .Target as $t |
            .Secrets[]? |
            "| \(.RuleID // "-" | clean) | \(.Severity // "-" | clean) | \(.Title // "-" | clean) | \($t | sub("^\\.trivy-scope/"; "") | clean) | \(.StartLine // "-") |"
          ' trivy-fs.json >> "$GITHUB_STEP_SUMMARY" || true
          { echo ""; echo "</details>"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$IMAGE_VULN" -gt 0 ]; then
          {
            echo "### 🐳 Image Vulnerabilities"
            echo "<details><summary>🔴 View all $IMAGE_VULN finding(s)</summary>"
            echo ""
            echo "| Image | Severity | CVE | Package | Installed | Fixed in |"
            echo "|-------|----------|-----|---------|-----------|----------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in trivy-image-*.json; do
            [ -f "$f" ] || continue
            jq -r '
              def clean: tostring | gsub("[\r\n|]"; " ");
              .ArtifactName as $image |
              .Results[]?.Vulnerabilities[]? |
              select(.Severity == "CRITICAL" or .Severity == "HIGH") |
              (
                if (.PrimaryURL // "") == ""
                then (.VulnerabilityID // "Unknown")
                else "[\(.VulnerabilityID // "Unknown")](\(.PrimaryURL))"
                end
              ) as $cve |
              "| \($image // "-" | clean) | \(.Severity) | \($cve) | \(.PkgName // "-" | clean) | \(.InstalledVersion // "-" | clean) | \(if (.FixedVersion // "") == "" then "-" else (.FixedVersion | clean) end) |"
            ' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done
          { echo ""; echo "</details>"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$TOTAL" -gt 0 ]; then
          ACTION_NUMBER=1
          {
            echo "## 2. Next action"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SECRET" -gt 0 ]; then
            echo "${ACTION_NUMBER}. **Fix secrets ($SECRET):** Rotate or revoke exposed credentials, remove them from source, and use GitHub Secrets, Vault, or environment variables. Use the reported file and line in **Secrets** above." >> "$GITHUB_STEP_SUMMARY"
            ACTION_NUMBER=$((ACTION_NUMBER + 1))
          fi

          if [ $((VULN + IMAGE_VULN)) -gt 0 ]; then
            echo "${ACTION_NUMBER}. **Fix vulnerabilities ($((VULN + IMAGE_VULN))):** Open the linked CVE(s) above, update to **Fixed in** when available, or update the base image, then rebuild." >> "$GITHUB_STEP_SUMMARY"
            ACTION_NUMBER=$((ACTION_NUMBER + 1))
          fi

          if [ "$MISCONF" -gt 0 ]; then
            echo "${ACTION_NUMBER}. **Fix misconfigurations ($MISCONF):** Open the linked rule ID(s) above and apply the reported **Resolution** to each file and line." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "Push the fixes and rerun the scan before merging."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # ── 6. Get commit author email ──────────────────────────────────────────
    - name: Get commit author email
      if: always() && (env.SECRET != '0' || env.VULN != '0' || env.MISCONF != '0' || env.IMAGE_VULN != '0')
      shell: bash
      run: |
        COMMIT_AUTHOR_EMAIL=$(git show -s --format='%ae' ${{ github.sha }})
        echo "COMMIT_AUTHOR_EMAIL=$COMMIT_AUTHOR_EMAIL" >> "$GITHUB_ENV"

    # ── 7. Clean mail recipients ────────────────────────────────────────────
    - name: Clean mail recipients
      if: always() && (env.SECRET != '0' || env.VULN != '0' || env.MISCONF != '0' || env.IMAGE_VULN != '0')
      shell: bash
      run: |
        RAW="${{ env.COMMIT_AUTHOR_EMAIL }},${{ inputs.extra-recipients }}"
        CLEAN=$(echo "$RAW" | tr ',' '\n' | grep -v 'noreply.github.com' | grep -v '^$' | tr '\n' ',' | sed 's/,$//')

        if [ -z "$CLEAN" ]; then
          CLEAN="${{ inputs.mail-username }}"
        fi

        echo "MAIL_RECEIVERS=$CLEAN" >> "$GITHUB_ENV"
    # ── 8. Mail full report ─────────────────────────────────────────────────
    - name: Build mail report
      if: always() && (env.SECRET != '0' || env.VULN != '0' || env.MISCONF != '0' || env.IMAGE_VULN != '0')
      shell: bash
      env:
        REPORT_REPOSITORY: ${{ github.repository }}
        REPORT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_PR_TITLE: ${{ github.event.pull_request.title }}
        REPORT_AUTHOR: ${{ github.actor }}
        REPORT_COMMIT: ${{ github.sha }}
        REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPORT_SEVERITY: ${{ inputs.severity }}
      run: |
        {
          echo "Trivy Security Scan — $SCAN_STATUS"
          echo "==============================================="
          echo "Repository : $REPORT_REPOSITORY"
          echo "PR         : #$REPORT_PR_NUMBER — $REPORT_PR_TITLE"
          echo "Author     : $REPORT_AUTHOR"
          echo "Commit     : $REPORT_COMMIT"
          echo "Run URL    : $REPORT_RUN_URL"
          echo ""
          echo "Findings summary"
          echo "----------------"
          echo "Secrets                                    : ${SECRET:-0}"
          echo "Vulnerabilities fs ($REPORT_SEVERITY) : ${VULN:-0}"
          echo "Misconfigurations ($REPORT_SEVERITY)  : ${MISCONF:-0}"
          echo "Vulnerabilities image ($REPORT_SEVERITY) : ${IMAGE_VULN:-0}"
          echo ""
          echo "Next actions"
          echo "------------"

          if [ "${SECRET:-0}" -gt 0 ]; then
            echo "- Rotate or revoke exposed credentials immediately, remove them from source, and move them to GitHub Secrets, Vault, or environment variables."
          fi
          if [ "${VULN:-0}" -gt 0 ]; then
            echo "- Update or replace affected filesystem packages. Use the Fixed in version when Trivy provides one."
          fi
          if [ "${MISCONF:-0}" -gt 0 ]; then
            echo "- Apply the recommended remediation to each reported configuration file."
          fi
          if [ "${IMAGE_VULN:-0}" -gt 0 ]; then
            echo "- Update affected image packages or the base image, rebuild and publish the image, then rerun the workflow."
          fi

          echo "- Push a remediation commit and wait for the Trivy workflow to pass before merging."
          echo ""
          echo "Open the workflow run above and read its Summary for affected packages, files, lines, and remediation links."
        } > trivy-mail-report.txt

    - name: Mail report
      if: always() && (env.SECRET != '0' || env.VULN != '0' || env.MISCONF != '0' || env.IMAGE_VULN != '0')
      uses: dawidd6/action-send-mail@v16
      with:
        server_address: ${{ inputs.smtp-server }}
        server_port: ${{ inputs.smtp-port }}
        username: ${{ inputs.mail-username }}
        password: ${{ inputs.mail-password }}
        subject: "[Trivy] ${{ env.SCAN_STATUS }} — PR #${{ github.event.pull_request.number }} (${{ github.repository }})"
        to: ${{ env.MAIL_RECEIVERS }}
        from: Security Bot <${{ inputs.mail-username }}>
        body: file://trivy-mail-report.txt

    # ── 9. Build + mail secret alert → IT team ─────────────────────────────
    - name: Build secret alert body
      if: always() && env.SECRET != '0'
      shell: bash
      run: |
        {
          echo "=== SECRET ALERT ==="
          echo "Repository : ${{ github.repository }}"
          echo "PR         : #${{ github.event.pull_request.number }}"
          echo "Author     : ${{ github.actor }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "--- Secrets found ---"
          [ -f trivy-fs.json ] && jq -r '
            .Results[]? | .Target as $t | .Secrets[]? |
            "File    : \($t)\nRule    : \(.RuleID)\nTitle   : \(.Title)\nSeverity: \(.Severity)\n"
          ' trivy-fs.json 2>/dev/null || echo "(no data)"
        } > secret-alert.txt

    - name: Mail secret alert to IT team
      if: always() && env.SECRET != '0'
      uses: dawidd6/action-send-mail@v16
      with:
        server_address: ${{ inputs.smtp-server }}
        server_port: ${{ inputs.smtp-port }}
        username: ${{ inputs.mail-username }}
        password: ${{ inputs.mail-password }}
        subject: "[SECRET ALERT] ${{ github.repository }} PR #${{ github.event.pull_request.number }} — ${{ env.SECRET }} secret(s)"
        to: ${{ inputs.it-team-email }}
        from: Security Bot <${{ inputs.mail-username }}>
        body: file://secret-alert.txt

    # ── 10. Upload scan artifacts ───────────────────────────────────────────
    - name: Upload scan artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: trivy-report-${{ github.sha }}
        path: |
          trivy-fs.json
          trivy-image-*.json
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore

    # ── 11. Fail pipeline ───────────────────────────────────────────────────
    - name: Evaluate result
      if: always()
      shell: bash
      run: |
        FAIL=0
        [ "$SECRET"     -gt 0 ] && echo "❌ $SECRET secret(s) in HEAD"              && FAIL=1
        [ "$VULN"       -gt 0 ] && echo "❌ $VULN fixable vuln(s) in filesystem"    && FAIL=1
        [ "$MISCONF"    -gt 0 ] && echo "❌ $MISCONF fixable misconfiguration(s)"   && FAIL=1
        [ "$IMAGE_VULN" -gt 0 ] && echo "❌ $IMAGE_VULN fixable vuln(s) in image"   && FAIL=1
        [ "$FAIL" -eq 0 ]      && echo "✅ No blocking findings. OK to merge."
        exit "$FAIL"
