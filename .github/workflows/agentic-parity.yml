name: Agentic Parity

on:
  pull_request:
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  parity:
    name: Parity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Run parity contract
        run: bash .agentic/tests/parity.sh

  check_job_results:
    name: Check job results
    if: always()
    needs: [parity]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        uses: svtechnmaa/.github/actions/check_job_results@3c968849d205d2ca9f5d398a959d4c500d682fc9 # main @ 2026-08-27
        with:
          jobs: ${{ toJSON(needs) }}
