name: Weekly Org Trivy Scan

on:
  push:
    branches:
      - feat/*
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 6"

permissions:
  contents: read
  security-events: write

env:
  ORG_NAME: svtechnmaa 

jobs:
   Schedule-Scan:
    runs-on: ubuntu-dind
    steps:                  
        - name: List all repositories
          run: |
            set -euo pipefail

            mkdir -p tmp
            : > tmp/repos.txt

            page=1

            while true; do
              response="$(curl -sS --fail \
                -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/${{ env.ORG_NAME }}/repos?type=all&per_page=100&page=${page}")"

              count="$(echo "${response}" | jq 'length')"

              if [ "${count}" -eq 0 ]; then
                break
              fi

              echo "${response}" | jq -r '.[].clone_url' >> tmp/repos.txt

              page=$((page + 1))
            done

            cat tmp/repos.txt

        - name: Scan all repositories with Trivy
          run: |
            set -euo pipefail
            export GITHUB_TOKEN="${{ secrets.GH_TOKEN }}"
            trivy repo --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,misconfig,secret --skip-version-check --format json -o trivy_scan_results.json tmp/repos.txt || true
        
