name: Weekly Org Trivy Scan

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:
#   schedule:
#     - cron: "17 2 * * 6"

permissions:
  contents: read
  security-events: write

env:
  ORG_NAME: svtechnmaa 

jobs:
   Schedule-Scan:
    runs-on: ubuntu-dind
    steps:          
        # - name: Get all repositories in the organization
        #   id: get_repos
          
        #   run: |
        #     echo "Fetching repositories for organization: ${{ env.ORG_NAME }}"
        #     echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token
        #     repos=$(gh repo list ${{ env.ORG_NAME }} --json name -q '.[].name')
        #     echo "Repositories: $repos"
        #     echo "REPOS=$repos" >> $GITHUB_ENV
        
        - name: List all repositories
          run: |
            set -euo pipefail

            mkdir -p tmp
            : > tmp/repos.txt

            page=1

            while true; do
              response="$(curl -sS --fail \
                -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/${{ env.ORG_NAME }}/repos?type=all&per_page=100&page=${page}")"

              count="$(echo "${response}" | jq 'length')"

              if [ "${count}" -eq 0 ]; then
                break
              fi

              echo "${response}" | jq -r '.[].name' >> tmp/repos.txt

              page=$((page + 1))
            done

            cat tmp/repos.txt