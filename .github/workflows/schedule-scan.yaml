name: Weekly Org Trivy Scan

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 6"

permissions:
  contents: read
  security-events: write

env:
  ORG_NAME: svtechnmaa

jobs:
   schedule-scan:
    runs-on: ubuntu-dind
    steps:
        - name: Checkout all repositories
          uses: actions/checkout@v3
          with:
            ref: ${{ github.event.pull_request.head.sha }}
            fetch-depth: 0
          
        - name: Install jq
          run: |
            sudo apt-get update
            sudo apt-get install -y jq

        - name: Get all repositories in the organization
          id: get_repos
          run: |
            repos=$(gh repo list ${{ env.ORG_NAME }} --json name -q '.[].name')
            echo "Repositories: $repos"
            echo "REPOS=$repos" >> $GITHUB_ENV
        
        - name: Test out check output 
          run: |
            echo "Repositories: ${{ env.REPOS }}"