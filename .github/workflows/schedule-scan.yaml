name: Weekly Org Trivy Scan

on:
  push:
    branches:
      - feat/*
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 6"

permissions:
  contents: read
  security-events: write

env:
  ORG_NAME: svtechnmaa 

jobs:
   Schedule-Scan:
    runs-on: ubuntu-dind
    steps:                  
        - name: List all repositories
          run: |
            set -euo pipefail

            mkdir -p tmp
            : > tmp/repos.txt

            page=1

            while true; do
              response="$(curl -sS --fail \
                -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/${{ env.ORG_NAME }}/repos?type=all&per_page=100&page=${page}")"

              count="$(echo "${response}" | jq 'length')"

              if [ "${count}" -eq 0 ]; then
                break
              fi

              echo "${response}" | jq -r '.[].clone_url' >> tmp/repos.txt

              page=$((page + 1))
            done

            cat tmp/repos.txt
                  
        - name: Trivy scan on all repositories
          run: |
            set -euo pipefail
            mkdir -p /tmp/trivy-result

            while read -r clone_url; do
              repo_name="$(basename "${clone_url}" .git)"
              repo_dir="repos/${repo_name}"

              auth_clone_url="$(echo "${clone_url}" | sed "s#https://#https://x-access-token:${{ secrets.GH_TOKEN }}@#")"

              echo "Processing ${repo_name}"

              if [ ! -d "${repo_dir}/.git" ]; then
                echo "Repo ${repo_name} not found locally. Cloning..."
                git clone --depth 1 "${auth_clone_url}" "${repo_dir}"
              else
                echo "Repo ${repo_name} already exists. Pulling latest..."

                cd "${repo_dir}"

                git remote set-url origin "${auth_clone_url}"
                git fetch origin

                if git show-ref --verify --quiet refs/remotes/origin/main; then
                  git checkout main || git checkout -b main origin/main
                  git pull origin main
                else
                  current_branch="$(git rev-parse --abbrev-ref HEAD)"
                  git pull origin "${current_branch}"
                fi

                cd - > /dev/null
              fi

              echo "Running Trivy scan on ${repo_dir}"
              trivy fs -f json  -o /tmp/trivy-result/"${repo_name}".json --scanners vuln,misconfig,secret --skip-version-check --severity HIGH,CRITICAL "${repo_dir}" || true

            done < tmp/repos.txt

            echo "All repositories are available and updated in repos/"

        - name: Summary Trivy reports to GitHub
          if: always()
          run: |
            set -euo pipefail

            echo "# Trivy scan summary" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "| Repository | Critical | High | Secrets | Misconfigurations |" >> "${GITHUB_STEP_SUMMARY}"
            echo "|---|---:|---:|---:|---:|" >> "${GITHUB_STEP_SUMMARY}"

            for report in /tmp/trivy-result/*.json; do
              [ -f "${report}" ] || continue

              repo_name="$(basename "${report}" .json)"

              critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${report}")"
              high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${report}")"
              secrets="$(jq '[.Results[]?.Secrets[]?] | length' "${report}")"
              misconfigs="$(jq '[.Results[]?.Misconfigurations[]?] | length' "${report}")"

              echo "| ${repo_name} | ${critical} | ${high} | ${secrets} | ${misconfigs} |" >> "${GITHUB_STEP_SUMMARY}"
            done
        
        - name: Write Trivy summary
          if: always()
          shell: bash
          run: |
            set -euo pipefail

            REPORT_DIR="/tmp/trivy-result"

            total_critical=0
            total_high=0
            total_secrets=0
            total_misconf_critical=0
            total_misconf_high=0

            {
              echo "# 🔍 Trivy Organization Scan"
              echo ""
              echo "**Organization:** \`${ORG_NAME}\`"
              echo ""
              echo "**Commit:** \`${{ github.sha }}\` · **Actor:** \`${{ github.actor }}\`"
              echo ""
              echo "## 📊 Repository Summary"
              echo ""
              echo "| Repository | Critical Vulns | High Vulns | Secrets | Critical Misconfigs | High Misconfigs | Status |"
              echo "|------------|---------------:|-----------:|--------:|--------------------:|----------------:|:------:|"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ ! -d "$REPORT_DIR" ]; then
              echo "No Trivy report directory found: \`$REPORT_DIR\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            for report in "$REPORT_DIR"/*.json; do
              [ -f "$report" ] || continue

              repo_name="$(basename "$report" .json)"

              critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")"
              high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")"

              secrets="$(jq '[.Results[]?.Secrets[]?] | length' "$report")"

              misconf_critical="$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL")] | length' "$report")"
              misconf_high="$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' "$report")"

              repo_total=$((critical + high + secrets + misconf_critical + misconf_high))

              total_critical=$((total_critical + critical))
              total_high=$((total_high + high))
              total_secrets=$((total_secrets + secrets))
              total_misconf_critical=$((total_misconf_critical + misconf_critical))
              total_misconf_high=$((total_misconf_high + misconf_high))

              if [ "$repo_total" -eq 0 ]; then
                status="✅"
              else
                status="❌"
              fi

              echo "| \`${repo_name}\` | ${critical} | ${high} | ${secrets} | ${misconf_critical} | ${misconf_high} | ${status} |" >> "$GITHUB_STEP_SUMMARY"
            done

            total_findings=$((total_critical + total_high + total_secrets + total_misconf_critical + total_misconf_high))

            {
              echo ""
              echo "## 📌 Total HIGH / CRITICAL Findings"
              echo ""
              echo "| Category | Count | Status |"
              echo "|----------|------:|:------:|"
              echo "| 🔴 Critical Vulnerabilities | ${total_critical} | $([ "$total_critical" = "0" ] && echo "✅" || echo "❌") |"
              echo "| 🟠 High Vulnerabilities | ${total_high} | $([ "$total_high" = "0" ] && echo "✅" || echo "❌") |"
              echo "| 🔑 Secrets | ${total_secrets} | $([ "$total_secrets" = "0" ] && echo "✅" || echo "❌") |"
              echo "| 🔴 Critical Misconfigurations | ${total_misconf_critical} | $([ "$total_misconf_critical" = "0" ] && echo "✅" || echo "❌") |"
              echo "| 🟠 High Misconfigurations | ${total_misconf_high} | $([ "$total_misconf_high" = "0" ] && echo "✅" || echo "❌") |"
              echo ""
              echo "**Total findings:** ${total_findings}"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          
        - name: Write Trivy details
          if: always()
          shell: bash
          run: |
            set -euo pipefail

            REPORT_DIR="/tmp/trivy-result"

            [ -d "$REPORT_DIR" ] || exit 0

            {
              echo "## 🛡️ Vulnerability Details"
              echo ""
              echo "<details><summary>View HIGH / CRITICAL vulnerabilities</summary>"
              echo ""
              echo "| Repository | Severity | CVE | Package | Installed | Fixed in | Target |"
              echo "|------------|----------|-----|---------|-----------|----------|--------|"
            } >> "$GITHUB_STEP_SUMMARY"

            for report in "$REPORT_DIR"/*.json; do
              [ -f "$report" ] || continue
              repo_name="$(basename "$report" .json)"

              jq -r --arg repo "$repo_name" '
                .Results[]? |
                .Target as $target |
                .Vulnerabilities[]? |
                select(.Severity == "CRITICAL" or .Severity == "HIGH") |
                "| `\($repo)` | \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \($target) |"
              ' "$report" >> "$GITHUB_STEP_SUMMARY" || true
            done

            {
              echo ""
              echo "</details>"
              echo ""
              echo "## ⚙️ Misconfiguration Details"
              echo ""
              echo "<details><summary>View HIGH / CRITICAL misconfigurations</summary>"
              echo ""
              echo "| Repository | Severity | ID | Title | File |"
              echo "|------------|----------|----|-------|------|"
            } >> "$GITHUB_STEP_SUMMARY"

            for report in "$REPORT_DIR"/*.json; do
              [ -f "$report" ] || continue
              repo_name="$(basename "$report" .json)"

              jq -r --arg repo "$repo_name" '
                .Results[]? |
                .Target as $target |
                .Misconfigurations[]? |
                select(.Severity == "CRITICAL" or .Severity == "HIGH") |
                "| `\($repo)` | \(.Severity) | [\(.ID)](\(.PrimaryURL // "")) | \(.Title) | \($target) |"
              ' "$report" >> "$GITHUB_STEP_SUMMARY" || true
            done

            {
              echo ""
              echo "</details>"
              echo ""
              echo "## 🔑 Secret Details"
              echo ""
              echo "<details><summary>View detected secrets</summary>"
              echo ""
              echo "| Repository | Severity | Rule ID | Category | Title | File | Line |"
              echo "|------------|----------|---------|----------|-------|------|------|"
            } >> "$GITHUB_STEP_SUMMARY"

            for report in "$REPORT_DIR"/*.json; do
              [ -f "$report" ] || continue
              repo_name="$(basename "$report" .json)"

              jq -r --arg repo "$repo_name" '
                .Results[]? |
                .Target as $target |
                .Secrets[]? |
                "| `\($repo)` | \(.Severity // "-") | \(.RuleID // "-") | \(.Category // "-") | \(.Title // "-") | \($target) | \((.StartLine // "-")|tostring)-\((.EndLine // .StartLine // "-")|tostring) |"
              ' "$report" >> "$GITHUB_STEP_SUMMARY" || true
            done

            {
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"        
        
