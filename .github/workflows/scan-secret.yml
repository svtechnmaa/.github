name: Reusable Betterleaks & Trivy Check

on:
  pull_request:
    branches: [main]
    
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  check-trailer:
    name: Betterleaks Trailer Report
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: trivy-dind
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate betterleaks trailer
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          base_ref="${{ github.event.pull_request.base.ref }}"
          repository_url="${{ github.server_url }}/${{ github.repository }}"
          echo "Checking PR commit range: ${base_sha}..${head_sha}"
          mapfile -t commits < <(git rev-list --reverse "${base_sha}..${head_sha}")

          if [ "${#commits[@]}" -eq 0 ]; then
            commits=("${head_sha}")
          fi

          missing_shas=()
          missing_types=()
          missing_subjects=()

          for sha in "${commits[@]}"; do
            echo "========== Commit ${sha} =========="
            msg="$(git log -1 --pretty=%B "${sha}")"
            echo "${msg}"

            trailers="$(printf "%s" "${msg}" | git interpret-trailers --parse)"
            echo "Parsed trailers for ${sha}"
            echo "${trailers}"

            if printf "%s\n" "${trailers}" | grep -q "^betterleaks-Scan: passed$"; then
              echo "Trailer OK for ${sha}"
            else
              echo "MISSING or INVALID betterleaks-Scan trailer in ${sha}"
              missing_shas+=("${sha}")

              parent_count="$(git rev-list --parents -n 1 "${sha}" | awk '{print NF - 1}')"
              if [ "${parent_count}" -gt 1 ]; then
                missing_types+=("merge")
              else
                missing_types+=("regular")
              fi

              subject="$(git log -1 --format=%s "${sha}")"
              missing_subjects+=("${subject//$'\r'/ }")
            fi
          done

          missing_count="${#missing_shas[@]}"

          {
            echo "# Betterleaks trailer check"
            echo

            if [ "${missing_count}" -eq 0 ]; then
              echo "> [!TIP]"
              echo "> All **${#commits[@]}** commit(s) in this pull request contain \`betterleaks-Scan: passed\`."
            else
              echo "> [!WARNING]"
              echo "> **${missing_count} commit(s)** do not contain a valid \`betterleaks-Scan: passed\` trailer and need to be scanned again. This check fails until every commit has the required trailer."
              echo
              echo "| Commit | Type | Subject |"
              echo "| --- | --- | --- |"

              for index in "${!missing_shas[@]}"; do
                sha="${missing_shas[$index]}"
                subject="${missing_subjects[$index]//|/\\|}"
                echo "| [\`${sha:0:12}\`](${repository_url}/commit/${sha}) | ${missing_types[$index]} | ${subject} |"
              done

              echo
              echo "## How it works"
              echo
              echo "Eacgh repository includes Betterleaks Git hooks in \`.githooks\`. Enable them by configuring Git's \`core.hooksPath\` to use that directory."
              echo
              echo "Before each commit, the \`pre-commit\` hook runs Betterleaks against the staged changes. If the scan passes, the \`prepare-commit-msg\` hook adds the \`betterleaks-Scan: passed\` trailer to the commit message as proof that the scan ran successfully. If Betterleaks detects a secret, the commit is blocked."
              echo
              echo "A commit without the required trailer was created without a successful hook scan, usually because the hooks were not enabled when that commit was made. The affected commits must therefore be replayed and amended after the hooks are enabled, causing Betterleaks to scan them and add the trailer."
              echo
              echo "## How to fix"
              echo
              echo "Rewriting commits changes their SHA. Coordinate with other contributors first, then push with \`git push --force-with-lease\`."
              echo
              echo "1. Make sure this repository's Betterleaks hooks are enabled:"
              echo
              echo '   ```bash'
              echo '   git config --global core.hooksPath .githooks'
              echo '   git config --global --get core.hooksPath'
              echo '   ```'
              echo
              echo "2. For missing regular commits, start an interactive rebase:"
              echo
              echo '   ```bash'
              echo '   git fetch origin'
              echo "   git rebase -i origin/${base_ref}"
              echo '   ```'
              echo
              echo "   Change \`pick\` to \`edit\` for every affected regular commit. Each time rebase stops, run:"
              echo
              echo '   ```bash'
              echo '   git commit --amend --no-edit'
              echo '   git rebase --continue'
              echo '   ```'
              echo
              echo "3. If an affected commit is a merge commit, preserve merges during the rebase:"
              echo
              echo '   ```bash'
              echo "   git rebase -i --rebase-merges origin/${base_ref}"
              echo '   ```'
              echo
              echo "   In the rebase todo, insert a line containing \`break\` immediately after the affected \`merge -C <commit> ...\` line. When rebase stops after recreating that merge commit, run:"
              echo
              echo '   ```bash'
              echo '   git commit --amend --no-edit'
              echo '   git rebase --continue'
              echo '   ```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${missing_count}" -gt 0 ]; then
            echo "::error title=Betterleaks scan required::${missing_count} commit(s) are missing a valid betterleaks-Scan: passed trailer. See the Job Summary for commit details and remediation steps."
            exit 1
          fi

