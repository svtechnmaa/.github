name: Reusable Betterleaks & Trivy Check

on:
  pull_request:
    branches: [main]
    
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  check-trailer:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: trivy-dind
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate betterleaks trailer
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo "Checking PR commit range: ${base_sha}..${head_sha}"
          mapfile -t commits < <(git rev-list --reverse "${base_sha}..${head_sha}")

          if [ "${#commits[@]}" -eq 0 ]; then
            commits=("${head_sha}")
          fi

          failed=0
          for sha in "${commits[@]}"; do
            echo "=== Commit ${sha} ==="
            msg="$(git log -1 --pretty=%B "${sha}")"
            echo "${msg}"

            trailers="$(printf "%s" "${msg}" | git interpret-trailers --parse)"
            echo "=== Parsed trailers for ${sha} ==="
            echo "${trailers}"

            if printf "%s\n" "${trailers}" | grep -q "^betterleaks-Scan: passed$"; then
              echo "Trailer OK for ${sha}"
            else
              echo "Missing or invalid betterleaks-Scan trailer in ${sha}"
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

  trivy-scan:
    name: Trivy Security Scan
    runs-on: trivy-dind
    needs: check-trailer
    steps:
